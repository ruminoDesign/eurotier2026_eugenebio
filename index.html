<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>EuroTier 2026</title>
</head>
<body>

<div id="gate" style="position:fixed; inset:0; background:#222; color:white;
     display:flex; flex-direction:column; align-items:center; justify-content:center;">
  <p>비밀번호를 입력하세요</p>
  <input type="password" id="pw" />
  <button onclick="checkPw()">확인</button>
  <p id="msg" style="color:red;"></p>
</div>

<div id="content" style="display:none;">
  <h1>여기에 대시보드 내용</h1>
</div>

<script>
function checkPw() {
  const input = document.getElementById("pw").value;
  if (input === "eugenebio2026") {   // 여기 원하는 비번으로 바꾸세요
    document.getElementById("gate").style.display = "none";
    document.getElementById("content").style.display = "block";
  } else {
    document.getElementById("msg").innerText = "비밀번호가 틀렸습니다";
  }
}
</script>

</body>
</html>
