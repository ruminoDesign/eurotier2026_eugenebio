<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EuroTier 2026 · 분류 검색</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #ffffff; color: #0b0b0b;
  }
  header {
    padding: 20px 24px 8px;
  }
  header a {
    color: #898781; text-decoration: none; font-size: 14px;
  }
  header h1 { font-size: 20px; margin: 8px 0 4px; }
  header p { color: #898781; font-size: 13px; margin: 0 0 16px; }

  .controls {
    padding: 0 24px 16px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
  }
  select {
    padding: 10px 12px; font-size: 15px; border: 1px solid #c3c2b7;
    border-radius: 6px; min-width: 260px; background: #fff; color: #0b0b0b;
  }
  #count { color: #898781; font-size: 13px; }

  table {
    width: 100%; border-collapse: collapse; font-size: 14px;
  }
  thead th {
    position: sticky; top: 0; background: #fcfcfb;
    text-align: left; padding: 10px 24px; border-bottom: 1px solid #c3c2b7;
    color: #52514e; font-weight: 600;
  }
  tbody td {
    padding: 10px 24px; border-bottom: 1px solid #e1e0d9; vertical-align: top;
  }
  tbody tr:hover { background: #fcfcfb; }
  td.cat { color: #52514e; font-size: 13px; }
  .empty { padding: 40px 24px; color: #898781; text-align: center; }
</style>
</head>
<body>

<header>
  <a href="index.html">← 처음으로</a>
  <h1>분류 키워드로 찾기</h1>
  <p>축종 · 기능 · 성분 조합(예: 111 = 세 조건 모두 해당)으로 업체를 필터링합니다</p>
  <p>
    <a href="https://docs.google.com/spreadsheets/d/1iLjb8PRKviTZZYvcEdxCTfQZNbryMT0ku45yo-p46T8/edit?usp=sharing"
       target="_blank" rel="noopener noreferrer"
       style="color:#2a78d6; font-weight:600;">
      📋 업체별 방문 체크 시트 열기
    </a>
  </p>
</header>

<div class="controls">
  <select id="codeSelect">
    <option value="all">전체 보기</option>
    <option value="111">111 · 축종+기능+성분 (핵심 타겟)</option>
    <option value="110">110 · 축종+기능</option>
    <option value="101">101 · 축종+성분</option>
    <option value="100">100 · 축종만</option>
    <option value="011">011 · 기능+성분</option>
    <option value="010">010 · 기능만</option>
    <option value="001">001 · 성분만</option>
    <option value="000">000 · 해당없음</option>
  </select>
  <span id="count"></span>
</div>

<table>
  <thead>
    <tr>
      <th>Hall</th>
      <th>Booth</th>
      <th>업체명</th>
      <th>카테고리</th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<div class="empty" id="emptyMsg" style="display:none;">해당하는 업체가 없습니다</div>

<script>
let exhibitors = [];
let keywordsById = {};

function loadCsv(path) {
  return new Promise(resolve => {
    Papa.parse(path, {
      download: true, header: true, skipEmptyLines: true,
      complete: res => resolve(res.data)
    });
  });
}

async function init() {
  const [exRows, mapRows] = await Promise.all([
    loadCsv("exhibitors.csv"),
    loadCsv("exhibitor_keyword_map.csv")
  ]);

  mapRows.forEach(r => {
    if (!r.id || !r.word) return;
    if (!keywordsById[r.id]) keywordsById[r.id] = [];
    keywordsById[r.id].push(r.word);
  });

  exhibitors = exRows.filter(r => r.id);
  render("all");
}

function render(code) {
  const rows = document.getElementById("rows");
  const emptyMsg = document.getElementById("emptyMsg");
  rows.innerHTML = "";

  const filtered = code === "all"
    ? exhibitors
    : exhibitors.filter(r => r.match_code === code);

  document.getElementById("count").innerText = `${filtered.length}개 업체`;

  if (filtered.length === 0) {
    emptyMsg.style.display = "block";
    return;
  }
  emptyMsg.style.display = "none";

  filtered
    .sort((a, b) => (a.hall || "").localeCompare(b.hall || ""))
    .forEach(r => {
      const cats = (keywordsById[r.id] || []).join(", ");
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${r.hall || "-"}</td>
        <td>${r.booth || "-"}</td>
        <td>${r.name}</td>
        <td class="cat">${cats || "-"}</td>
      `;
      rows.appendChild(tr);
    });
}

document.getElementById("codeSelect").addEventListener("change", e => {
  render(e.target.value);
});

init();
</script>

</body>
</html>
